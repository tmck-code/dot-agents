# Local-only security stack for the hardened OpenCode launcher.
#
#   opencode-agent  (internal: true)  agent, squid, broker, litellm
#   opencode-egress (bridge)          squid, broker-admin, litellm
#
# The agent is attached to the internal network only. Squid is the only generic
# egress path; LiteLLM is the only model-provider path; the broker is the only
# GitHub credential path.
name: opencode-stack

networks:
  opencode-agent:
    name: opencode-agent
    internal: true
  opencode-egress:
    name: opencode-egress
    driver: bridge
    # Pinned so the gateway address is known and Squid can deny it (blocked_dst).
    ipam:
      config:
        - subnet: "${OPENCODE_EGRESS_SUBNET:-172.31.250.0/24}"
  # Model-key state only. The agent is not attached, so it cannot reach the
  # LiteLLM database directly.
  opencode-data:
    name: opencode-data
    internal: true

volumes:
  broker-state:
    name: opencode-broker-state
  squid-logs:
    name: opencode-squid-logs
  litellm-db:
    name: opencode-litellm-db

# One file per secret; each service lists only the secrets it needs.
secrets:
  github_app_pem:
    file: ./secrets/github-app.pem
  litellm_keygen_key:
    file: ./secrets/litellm-keygen.key
  broker_admin_token:
    file: ./secrets/broker-admin.token
  litellm_master_key:
    file: ./secrets/litellm-master.key
  litellm_env:
    file: ./secrets/litellm.env
  postgres_password:
    file: ./secrets/postgres-password
  llama_api_key:
    file: ./secrets/llama-api-key

x-broker-env: &broker-env
  BROKER_DB: /state/broker.db
  BROKER_DEFAULT_TTL_SECONDS: ${BROKER_DEFAULT_TTL_SECONDS:-28800}
  BROKER_MAX_TTL_SECONDS: ${BROKER_MAX_TTL_SECONDS:-86400}
  BROKER_DEFAULT_GRANT_TTL_SECONDS: ${BROKER_DEFAULT_GRANT_TTL_SECONDS:-900}
  BROKER_MAX_GRANT_TTL_SECONDS: ${BROKER_MAX_GRANT_TTL_SECONDS:-3600}
  BROKER_REFRESH_SKEW_SECONDS: ${BROKER_REFRESH_SKEW_SECONDS:-300}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app.pem
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
  LITELLM_URL: http://litellm:4000
  LITELLM_KEYGEN_KEY_FILE: /run/secrets/litellm_keygen_key
  LITELLM_MODELS: ${LITELLM_MODELS:-claude-sonnet,claude-opus,gpt-mini,deepseek-chat,deepseek-reasoner,qwen-local}

x-broker: &broker
  image: opencode-lease-broker:local
  build:
    context: ../broker
    dockerfile: Dockerfile
  # Secret files are mode 0600 and owned by the host user, so the broker must
  # run as that user to read them. broker-state-init gives it the state volume.
  user: "${OPENCODE_UID:-1000}:${OPENCODE_GID:-1000}"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - broker-state:/state
  environment: *broker-env

services:
  squid:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    container_name: opencode-squid
    restart: unless-stopped
    networks:
      - opencode-agent
      - opencode-egress
    read_only: true
    tmpfs:
      - /run:mode=1777,size=16m
      - /var/spool/squid:mode=1777,size=64m
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - squid-logs:/var/log/squid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    pids_limit: ${SQUID_PIDS_LIMIT:-256}
    mem_limit: ${SQUID_MEMORY:-512m}
    cpus: ${SQUID_CPUS:-1}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/3128'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: opencode-postgres
    restart: unless-stopped
    networks:
      - opencode-data
    read_only: true
    tmpfs:
      - /run/postgresql:mode=1777,size=16m
      - /tmp:mode=1777,size=64m
    volumes:
      - litellm-db:/var/lib/postgresql/data
    secrets:
      - postgres_password
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    mem_limit: ${POSTGRES_MEMORY:-1g}
    cpus: ${POSTGRES_CPUS:-1}
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: litellm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Optional diagram renderer. Profile-gated because the Playwright image is
  # large and only needed for visual diagram validation. The agent reaches it
  # on opencode-agent; the renderer reaches esm.sh only through Squid.
  excalidraw:
    build:
      context: ../tools/excalidraw-renderer
      dockerfile: Dockerfile
    image: opencode-excalidraw-renderer:local
    container_name: opencode-excalidraw
    profiles: ["tools"]
    restart: unless-stopped
    networks:
      - opencode-agent
    depends_on:
      squid:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    shm_size: 1gb
    user: "1000:1000"
    init: true
    pids_limit: ${EXCALIDRAW_PIDS_LIMIT:-512}
    mem_limit: ${EXCALIDRAW_MEMORY:-2g}
    cpus: ${EXCALIDRAW_CPUS:-1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: litellm,broker,squid,localhost,127.0.0.1,::1
      no_proxy: litellm,broker,squid,localhost,127.0.0.1,::1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Optional local model. Profile-gated so the base stack and tests do not
  # need a 2.5 GB GGUF or a GPU. Only LiteLLM joins this service: the agent is
  # not on opencode-data and cannot reach llama:8080.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:d880b2a0e478795ce99d0a275732f5a50e579cb234ae7d2d3815afc909fd02f2
    container_name: opencode-llama
    profiles: ["llama"]
    restart: unless-stopped
    networks:
      - opencode-data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    user: "${LLAMA_UID:-1000}:${LLAMA_GID:-1000}"
    init: true
    pids_limit: ${LLAMA_PIDS_LIMIT:-512}
    mem_limit: ${LLAMA_MEMORY:-6g}
    cpus: ${LLAMA_CPUS:-4}
    secrets:
      - llama_api_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${LLAMA_MODEL_PATH:-./models/model.gguf}:/models/model.gguf:ro
    environment:
      HOME: /tmp
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-65536}
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-0}
    # The shell defers $${...} expansion to container start, so the GPU
    # override can raise LLAMA_N_GPU_LAYERS without duplicating the command.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        exec /app/llama-server \
          --model /models/model.gguf \
          --alias qwen3.5-4b \
          --host 0.0.0.0 \
          --port 8080 \
          --ctx-size "$${LLAMA_CTX_SIZE:-65536}" \
          --parallel 1 \
          --n-gpu-layers "$${LLAMA_N_GPU_LAYERS:-0}" \
          --flash-attn on \
          --cache-type-k q8_0 \
          --cache-type-v q8_0 \
          --jinja \
          --no-webui \
          --api-key "$$(cat /run/secrets/llama_api_key)"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:c169fb3adc514fcf210377c203f3de406d54f10bfdacf13948a4a839db9af7de
    container_name: opencode-litellm
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - opencode-agent
      - opencode-egress
      - opencode-data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /app/.cache:mode=1777,size=256m
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    secrets:
      - litellm_master_key
      - source: litellm_env
        target: litellm.env
      - postgres_password
      - llama_api_key
    pids_limit: ${LITELLM_PIDS_LIMIT:-512}
    mem_limit: ${LITELLM_MEMORY:-2g}
    cpus: ${LITELLM_CPUS:-2}
    environment:
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Provider root keys are read from a read-only secret mount at startup and
    # only ever exist in this container's environment, never in the agent.
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        LITELLM_MASTER_KEY="$$(cat /run/secrets/litellm_master_key)"
        LLAMA_API_KEY="$$(cat /run/secrets/llama_api_key)"
        LITELLM_DATABASE_URL="postgresql://litellm:$$(cat /run/secrets/postgres_password)@postgres:5432/litellm"
        export LITELLM_MASTER_KEY LLAMA_API_KEY LITELLM_DATABASE_URL
        set -a
        [ -f /run/secrets/litellm.env ] && . /run/secrets/litellm.env
        set +a
        exec litellm --config /app/config.yaml --port 4000 --num_workers 1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  broker-state-init:
    image: opencode-lease-broker:local
    container_name: opencode-broker-state-init
    user: "0:0"
    command:
      - chown
      - -R
      - "${OPENCODE_UID:-1000}:${OPENCODE_GID:-1000}"
      - /state
    network_mode: none
    read_only: true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - broker-state:/state

  broker:
    <<: *broker
    container_name: opencode-broker
    networks:
      - opencode-agent
    secrets:
      - source: github_app_pem
        target: github-app.pem
      - litellm_keygen_key
    pids_limit: ${BROKER_PIDS_LIMIT:-128}
    mem_limit: ${BROKER_MEMORY:-256m}
    cpus: ${BROKER_CPUS:-0.5}
    # GitHub is reached only through Squid. litellm stays direct.
    environment:
      <<: *broker-env
      HTTPS_PROXY: http://squid:3128
      HTTP_PROXY: http://squid:3128
      https_proxy: http://squid:3128
      http_proxy: http://squid:3128
      NO_PROXY: litellm,squid,localhost,127.0.0.1
      no_proxy: litellm,squid,localhost,127.0.0.1
    depends_on:
      broker-state-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      squid:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Host-only admin listener. It is not attached to opencode-agent, so the
  # agent cannot reach lease administration even though it shares the state
  # volume. The host publishes it on loopback only.
  broker-admin:
    <<: *broker
    container_name: opencode-broker-admin
    command:
      - uvicorn
      - broker.admin_app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --no-access-log
    secrets:
      - litellm_keygen_key
      - broker_admin_token
    pids_limit: ${BROKER_ADMIN_PIDS_LIMIT:-128}
    mem_limit: ${BROKER_ADMIN_MEMORY:-256m}
    cpus: ${BROKER_ADMIN_CPUS:-0.5}
    environment:
      <<: *broker-env
      BROKER_ADMIN_TOKEN_FILE: /run/secrets/broker_admin_token
    networks:
      - opencode-egress
    ports:
      - 127.0.0.1:8081:8081
    depends_on:
      broker-state-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
