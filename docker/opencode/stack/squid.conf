# Default-deny forward proxy for the OpenCode agent network.
#
# The agent has no default route; this proxy is its only egress path. It sees
# only the destination host (and, for plain HTTP, the URL); it does not
# terminate TLS and cannot inject provider headers. Provider auth belongs to
# LiteLLM, and GitHub auth belongs to the lease broker.
#
# Squid cannot enforce HTTP methods or paths. The allowlist is a destination
# allowlist, not a data-loss boundary: any allowed domain can still be an
# exfiltration channel. Scope it to what the project actually needs.

http_port 3128
visible_hostname opencode-squid

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 9418
acl CONNECT method CONNECT

# Cloud metadata and link-local space are never legitimate project egress.
acl metadata dst 169.254.0.0/16
acl metadata dst 100.100.100.200/32
acl metadata dst fd00:ec2::254/128

# Projects, registries and the selected model providers. GitHub and package
# registries are needed for normal development; model traffic normally goes to
# LiteLLM and never reaches this list.
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .githubassets.com
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .npmjs.com
acl allowed_domains dstdomain .yarnpkg.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .golang.org
acl allowed_domains dstdomain .proxy.golang.org
acl allowed_domains dstdomain .sum.golang.org
acl allowed_domains dstdomain opencode.ai
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .openai.com
acl allowed_domains dstdomain .openrouter.ai
acl allowed_domains dstdomain .deepseek.com
acl allowed_domains dstdomain .googleapis.com
acl allowed_domains dstdomain .groq.com
acl allowed_domains dstdomain .mistral.ai
acl allowed_domains dstdomain .x.ai

http_access deny metadata
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet allowed_domains
http_access deny all
deny_info ERR_ACCESS_DENIED all

# No caching: this is a policy checkpoint, not a content cache.
cache deny all
coredump_dir /var/spool/squid

# Log the timestamp, client, result, method, destination host, status and
# lease identifier. Never log headers, bodies, cookies or query strings.
strip_query_terms on
logformat opencode %ts.%03tu %tr %>a %Ss/%03>Hs %rm %>rd %<st %{X-Lease-Id}>h
access_log stdio:/var/log/squid/access.log opencode
cache_log /var/log/squid/cache.log
cache_store_log none
logfile_rotate 0
pid_filename /run/squid.pid
