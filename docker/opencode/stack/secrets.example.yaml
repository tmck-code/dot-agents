# Example SOPS+age source for scripts/opencode-secrets.sh.
#
# Copy to ../../secrets.enc.yaml (repo root is ignored by git), fill in real
# values, then encrypt in place:
#
#   age-keygen -o ~/.config/sops/age/keys.txt
#   chmod 600 ~/.config/sops/age/keys.txt
#   sops --encrypt --age "$(age-keygen -y ~/.config/sops/age/keys.txt)" \
#        --in-place secrets.enc.yaml
#
# Keep an offline backup of the age key. Without it the file is unrecoverable.
# Never commit the plaintext file, the age key, or the .kdbx database.

# Generated secrets are not listed here: litellm-keygen.key, postgres-password and
# llama-api-key, and (when absent) broker-admin.token and litellm-master.key, are
# created by stack/online.sh and stack/llama.sh on first run. Set
# BROKER_ADMIN_TOKEN or LITELLM_MASTER_KEY below only to supply your own values.

GITHUB_APP_ID: "123456"
GITHUB_INSTALLATION_ID: "12345678"

# Shared secret for the host-only broker admin listener.
BROKER_ADMIN_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_VALUE"

# LiteLLM master key and provider root keys. Only the host-side stack sees
# these; the agent receives per-lease virtual keys instead.
LITELLM_MASTER_KEY: "REPLACE_WITH_A_LONG_RANDOM_VALUE"
LITELLM_MODELS: "claude-sonnet,claude-opus,gpt-mini,deepseek-chat,deepseek-reasoner"
ANTHROPIC_API_KEY: "REPLACE_ME"
OPENAI_API_KEY: "REPLACE_ME"
DEEPSEEK_API_KEY: "REPLACE_ME"
OPENROUTER_API_KEY: "REPLACE_ME"

# Optional provider keys for the LiteLLM catalog in litellm.yaml.
# GROQ_API_KEY: "REPLACE_ME"
# MISTRAL_API_KEY: "REPLACE_ME"
# XAI_API_KEY: "REPLACE_ME"
